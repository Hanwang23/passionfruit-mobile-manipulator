controller_manager:
  ros__parameters:
    steering_controller:
      type: position_controllers/JointGroupPositionController
    wheel_controller:
      type: velocity_controllers/JointGroupVelocityController

steering_controller:
  ros__parameters:
    joints:
      - front_left_steering_joint
      - front_right_steering_joint
      - rear_left_steering_joint
      - rear_right_steering_joint

wheel_controller:
  ros__parameters:
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint

# The floating-base arm applies torque through Gazebo's position PID.
elfin_arm_controller:
  ros__parameters:
    command_interfaces: [position]

gazebo_ros2_control:
  ros__parameters:
    pid_gains:
      position:
        elfin_joint1: {kp: 200.0, ki: 30.0, kd: 8.0, min_integral_error: -12.0, max_integral_error: 12.0}
        elfin_joint2: {kp: 480.0, ki: 100.0, kd: 16.0, min_integral_error: -28.0, max_integral_error: 28.0}
        elfin_joint3: {kp: 240.0, ki: 65.0, kd: 7.0, min_integral_error: -14.0, max_integral_error: 14.0}
        elfin_joint4: {kp: 48.0, ki: 8.0, kd: 1.2, min_integral_error: -3.0, max_integral_error: 3.0}
        elfin_joint5: {kp: 30.0, ki: 5.0, kd: 0.5, min_integral_error: -2.0, max_integral_error: 2.0}
        elfin_joint6: {kp: 8.0, ki: 1.0, kd: 0.1, min_integral_error: -0.3, max_integral_error: 0.3}
